<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floris Terpstra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <div class="rig">

   
    <header class="topbar">
      <div class="project-name">
        <span class="label">PROJECT NAME</span>
        <span class="name">Floris Terpstra</span>
      </div>

      <button class="lamp-switch" id="themeToggle" type="button" aria-pressed="false" aria-label="Wissel tussen dark en light mode">
        <span class="bulb"></span>
        <span class="track"></span>
        <span class="state" id="themeState">DARK</span>
      </button>
    </header>

   
    <main class="eq-area">
      <span class="placeholder"></span>
    </main>

   
    <nav class="controlbar" aria-label="Hoofdnavigatie">
      <div class="bump" aria-hidden="true"></div>
      <div class="knob-row">
        <a class="knob-btn" href="https://github.com/floristerpstra123/model/blob/main/README.md" data-target="log">
          <span class="knob"></span>
          <span class="tick">LOG</span>
        </a>
        <a class="knob-btn" href="story.html" data-target="story">
          <span class="knob"></span>
          <span class="tick">STORY</span>
        </a>
        <a class="knob-btn" href="contact.html" data-target="contact">
          <span class="knob"></span>
          <span class="tick">CONTACT</span>
        </a>
      </div>
    </nav>

  </div>

<script src="script.js"></script>

</body>
</html>
